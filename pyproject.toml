[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "permafrost-framework"
version = "0.3.0"
description = "Extreme compression platform for long-term data archival — SQL, NoSQL, Social Media"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Permafrost Contributors" }]
keywords = [
  "compression", "archival", "parquet", "lzma", "cold-storage",
  "permafrost", "nosql", "data-engineering", "duckdb"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving :: Compression",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyarrow>=12.0.0",
  "zstandard>=0.21.0",
  "duckdb>=0.9.0",
  "typer>=0.9.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
full = ["lz4>=4.3.0", "brotli>=1.0.9"]
dev  = ["pytest>=7.0", "pytest-cov", "build", "twine"]

[project.urls]
Homepage   = "https://github.com/SEU_USUARIO/permafrost-framework"
Repository = "https://github.com/SEU_USUARIO/permafrost-framework"
Issues     = "https://github.com/SEU_USUARIO/permafrost-framework/issues"
Changelog  = "https://github.com/SEU_USUARIO/permafrost-framework/blob/main/CHANGELOG.md"

[project.scripts]
permafrost = "permafrost_cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
