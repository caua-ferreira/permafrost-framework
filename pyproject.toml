[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permafrost-framework"
version = "1.1.3"
description = "Distributed intelligent compression for long-term data archival"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Permafrost Contributors" }]
keywords = ["compression","archival","lzma","cold-storage","permafrost","duckdb","distributed"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = [
    "numpy>=1.24.0", "pandas>=2.0.0", "pyarrow>=12.0.0",
    "zstandard>=0.21.0", "duckdb>=0.9.0",
    "typer>=0.9.0", "rich>=13.0.0",
    "fastapi>=0.100.0", "uvicorn>=0.23.0", "httpx>=0.24.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
s3        = ["boto3>=1.26.0"]
gcs       = ["google-cloud-storage>=2.10.0"]
azure     = ["azure-storage-blob>=12.17.0"]
all-cloud = ["boto3>=1.26.0","google-cloud-storage>=2.10.0","azure-storage-blob>=12.17.0"]
kms       = ["boto3>=1.26.0","google-cloud-kms>=2.0.0"]
spark      = ["pyspark>=4.0"]
kubernetes = ["kopf>=1.36.0","kubernetes>=28.0.0"]
dev        = ["pytest>=7.0","pytest-cov","build","twine","pyinstaller>=6.0","kopf>=1.36.0"]

[project.urls]
Homepage      = "https://caua-ferreira.github.io/permafrost-framework"
Documentation = "https://caua-ferreira.github.io/permafrost-framework"
Repository    = "https://github.com/caua-ferreira/permafrost-framework"
"Bug Tracker" = "https://github.com/caua-ferreira/permafrost-framework/issues"
Changelog     = "https://github.com/caua-ferreira/permafrost-framework/blob/main/CHANGELOG.md"

[project.scripts]
permafrost = "permafrost.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["src/permafrost/spark.py"]

[tool.coverage.report]
omit = ["src/permafrost/spark.py"]
