site_name: Permafrost Data Framework
site_description: Distributed intelligent compression for long-term data archival — SQL, NoSQL, Social Media
site_url: https://caua-ferreira.github.io/permafrost-framework
repo_url: https://github.com/caua-ferreira/permafrost-framework
repo_name: permafrost-framework
copyright: Copyright &copy; 2026 Permafrost Contributors — Apache 2.0

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/snowflake

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/caua-ferreira/permafrost-framework
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/permafrost-framework
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Freeze & Thaw: user-guide/freeze-thaw.md
    - SQL & NoSQL (JSONL): user-guide/nosql.md
    - Streaming (Datasets > RAM): user-guide/streaming.md
    - Cloud Storage (S3/GCS/Azure): user-guide/cloud.md
    - Catalog (DuckDB): user-guide/catalog.md
    - Cluster Distribuído: user-guide/cluster.md
  - API Reference:
    - PermafrostContext (v1.0): api-reference/context.md
    - Core (freeze/thaw/audit): api-reference/core.md
    - PermafrostCatalog: api-reference/catalog.md
    - StorageAdapter: api-reference/storage.md
    - Cluster: api-reference/cluster.md
  - Format Spec: format-spec.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md
  - Changelog: changelog.md
