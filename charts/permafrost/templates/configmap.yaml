apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "permafrost.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "permafrost.labels" . | nindent 4 }}
data:
  PERMAFROST_MASTER_URL: {{ include "permafrost.masterUrl" . | quote }}
  PERMAFROST_MAX_RETRIES: {{ .Values.config.maxRetries | quote }}
  PERMAFROST_HEARTBEAT_S: {{ .Values.config.heartbeatSeconds | quote }}
  PERMAFROST_DEFAULT_CHUNK: {{ .Values.config.defaultChunkRows | quote }}
  {{- range $k, $v := .Values.master.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
