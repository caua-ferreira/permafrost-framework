apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: permafrostjobs.permafrost.io
  labels:
    app.kubernetes.io/name: permafrost
    app.kubernetes.io/managed-by: Helm
spec:
  group: permafrost.io
  names:
    kind: PermafrostJob
    listKind: PermafrostJobList
    plural: permafrostjobs
    singular: permafrostjob
    shortNames:
      - pfjob
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: JobID
          type: string
          jsonPath: .status.jobId
        - name: Ratio
          type: number
          jsonPath: .status.ratio
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["sourcePath"]
              properties:
                sourcePath:
                  type: string
                  description: >
                    Path to the source file. Can be a local path visible
                    to the worker (e.g. /data/dump.csv) or a cloud URI
                    (s3://bucket/key, gs://bucket/key, az://container/blob).
                outputPath:
                  type: string
                  description: >
                    Destination path for the .permafrost file.
                    Defaults to sourcePath with .permafrost extension.
                codec:
                  type: string
                  enum: ["lzma2", "zstd", "zpaq", "auto"]
                  default: "lzma2"
                  description: Compression codec.
                quant:
                  type: string
                  enum: ["none", "high", "medium", "low"]
                  default: "none"
                  description: Float quantization level.
                partitionBy:
                  type: string
                  description: Column name to partition the sparse index by.
                chunkRows:
                  type: integer
                  minimum: 100
                  maximum: 10000000
                  default: 10000
                  description: Rows per compressed chunk.
                masterUrl:
                  type: string
                  default: "http://permafrost-master:8700"
                  description: URL of the PermafrostMaster service.
                token:
                  type: string
                  description: JWT token for RBAC-enabled clusters.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Completed", "Failed"]
                  description: Current phase of the job.
                jobId:
                  type: string
                  description: Job identifier assigned by the master.
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                message:
                  type: string
                  description: Human-readable status message.
                ratio:
                  type: number
                  description: Compression ratio achieved (original/compressed).
                storedMb:
                  type: number
                  description: Size of the compressed output in MB.
