name: Build & Release Standalone Binary

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.7.0)"
        required: false

permissions: read-all

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      tag: ${{ steps.ctx.outputs.TAG }}
      ref: ${{ steps.ctx.outputs.REF }}

    steps:
      - name: Determine tag and ref
        id: ctx
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "REF=refs/tags/${TAG}" >> $GITHUB_OUTPUT

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: permafrost-linux-x86_64
            binary: dist/permafrost
          - os: macos-latest
            asset_name: permafrost-macos-arm64
            binary: dist/permafrost
          - os: windows-latest
            asset_name: permafrost-windows-x86_64.exe
            binary: dist/permafrost.exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller permafrost.spec

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ${{ matrix.binary }}
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version
        shell: pwsh
        continue-on-error: true

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/permafrost.exe ${{ matrix.asset_name }}
          else
            mv dist/permafrost ${{ matrix.asset_name }}
          fi

      - name: Compute SHA-256
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.prepare.outputs.tag }}"
          VER_BARE="${VERSION#v}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[?${VER_BARE}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Standalone binary release for ${VERSION}." > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Permafrost ${{ needs.prepare.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            release-assets/permafrost-linux-x86_64
            release-assets/permafrost-linux-x86_64.sha256
            release-assets/permafrost-macos-arm64
            release-assets/permafrost-macos-arm64.sha256
            release-assets/permafrost-windows-x86_64.exe
            release-assets/permafrost-windows-x86_64.exe.sha256
