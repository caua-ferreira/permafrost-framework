name: Build & Release Standalone Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.7.0)"
        required: false

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: permafrost-linux-x86_64
            binary: dist/permafrost
          - os: macos-latest
            asset_name: permafrost-macos-arm64
            binary: dist/permafrost
          - os: windows-latest
            asset_name: permafrost-windows-x86_64.exe
            binary: dist/permafrost.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller permafrost.spec

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ${{ matrix.binary }}
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ${{ matrix.binary }} --help
          ${{ matrix.binary }} --version
        shell: pwsh
        continue-on-error: true

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/permafrost.exe ${{ matrix.asset_name }}
          else
            mv dist/permafrost ${{ matrix.asset_name }}
          fi

      - name: Compute SHA-256
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          VER_BARE="${VERSION#v}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[?${VER_BARE}\]?/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Standalone binary release for ${VERSION}." > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Permafrost ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            release-assets/permafrost-linux-x86_64
            release-assets/permafrost-linux-x86_64.sha256
            release-assets/permafrost-macos-arm64
            release-assets/permafrost-macos-arm64.sha256
            release-assets/permafrost-windows-x86_64.exe
            release-assets/permafrost-windows-x86_64.exe.sha256
