name: Build & Push Docker Images

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_MASTER: cauaferreiraa/permafrost-master
  IMAGE_WORKER: cauaferreiraa/permafrost-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: read

    steps:
      - name: Determine tag and ref
        id: ctx
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "REF=refs/tags/${TAG}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.REF }}

      # Necessário para docker/metadata-action interpretar semver corretamente
      - name: Override GITHUB_REF
        run: echo "GITHUB_REF=refs/tags/${{ steps.ctx.outputs.TAG }}" >> $GITHUB_ENV

      - name: Docker meta — master
        id: meta-master
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_MASTER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Docker meta — worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WORKER }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push — Master
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.master
          push: true
          tags: ${{ steps.meta-master.outputs.tags }}
          labels: ${{ steps.meta-master.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build & Push — Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Resumo
        run: |
          echo "## Docker Images Publicadas" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_MASTER }}:${{ steps.ctx.outputs.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_WORKER }}:${{ steps.ctx.outputs.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose up --scale worker=4" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
